plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '3.1'
    }

    // One release key for every TV, kept outside the repository (CLAUDE.md, "Releases"): the keystore path and its
    // password come from the environment, which build-and-install.sh and tools/release.sh fill from
    // ~/.tv-home-arabic/release.jks and the macOS Keychain. Without them (a fresh clone, a contributor) release builds
    // fall back to the debug key, which installs fine on a new TV but cannot update one signed with the release key.
    def releaseStore = System.getenv('TVHOME_KEYSTORE')
    def releasePass = System.getenv('TVHOME_KS_PASS')
    def releaseKey = releaseStore && releasePass && file(releaseStore).isFile()
    signingConfigs {
        release {
            if (releaseKey) {
                storeFile file(releaseStore)
                storePassword releasePass
                keyAlias System.getenv('TVHOME_KEY_ALIAS') ?: 'tvhome-release'
                keyPassword releasePass
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
    // custom_home tests only: ICU4J is the same Umm al-Qura calendar as android.icu on the TV, and org.json the
    // real parser behind MatchFeed (android.jar only has stubs of it on the JVM).
    testImplementation 'com.ibm.icu:icu4j:74.2'
    testImplementation 'org.json:json:20231013'
}
